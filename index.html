<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>벚꽃 캐치캐치</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
        }
        #game-container { position: relative; width: 100vw; height: 100vh; }
        video {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            transform: scaleX(-1);      /* 거울처럼 보이도록 좌우 반전 */
        }
        canvas { position: absolute; top: 0; left: 0; z-index: 10; }

        /* ===== 게임 중 HUD ===== */
        #hud {
            position: absolute; top: 20px; left: 20px; z-index: 20;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            display: flex; flex-direction: column; gap: 6px;
        }
        .score-board { font-size: 3rem; font-weight: 900; color: #ffb7c5; line-height: 1.1; }
        .time-board  { font-size: 1.9rem; font-weight: 700; color: #fde047; }
        .time-board.warn { color: #f87171; animation: blink 0.5s steps(2) infinite; }
        @keyframes blink { to { opacity: 0.4; } }
        .hint { font-size: 1.25rem; font-weight: 700; margin: 0; }

        #top-right { position: absolute; top: 20px; right: 20px; z-index: 30; display: none; gap: 10px; }
        #top-right.show { display: flex; }

        /* ===== 버튼 ===== */
        .btn {
            border: 0; cursor: pointer; font: inherit; font-weight: 700; color: #fff;
            border-radius: 999px; transition: transform 0.15s, filter 0.15s;
        }
        .btn:hover { filter: brightness(1.1); transform: scale(1.04); }
        .btn:active { transform: scale(0.96); }
        .btn-pink { background: linear-gradient(90deg, #ec4899, #f43f5e); box-shadow: 0 10px 25px rgba(236,72,153,0.45); }
        .btn-gray { background: #374151; border: 1px solid #6b7280; }
        .btn-red  { background: linear-gradient(90deg, #ef4444, #ec4899); border: 1px solid rgba(255,255,255,0.3); }
        .btn-lg { padding: 16px 40px; font-size: 1.5rem; }
        .btn-md { padding: 12px 28px; font-size: 1.2rem; }
        .btn-sm { padding: 8px 20px; font-size: 1.05rem; }
        .icon-btn {
            width: 46px; height: 46px; border-radius: 50%; font-size: 1.3rem; padding: 0;
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.35);
        }

        /* 시간 선택 */
        .seg { display: inline-flex; gap: 6px; background: rgba(255,255,255,0.12); border-radius: 999px; padding: 6px; }
        .seg button {
            border: 0; cursor: pointer; font: inherit; font-weight: 700; font-size: 1.15rem;
            padding: 10px 22px; border-radius: 999px; background: transparent; color: #e5e7eb;
            transition: background 0.15s, color 0.15s;
        }
        .seg button:hover { background: rgba(255,255,255,0.15); }
        .seg button.active { background: #f472b6; color: #fff; }

        /* ===== 오버레이 공통 ===== */
        .overlay {
            position: absolute; inset: 0; z-index: 50;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px;
        }
        .overlay.hidden { display: none; }
        .dim { background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); }
        .dim-light { background: rgba(0,0,0,0.35); }

        #start-screen h1 {
            font-size: clamp(2.4rem, 7vw, 4rem); font-weight: 900; color: #f472b6;
            margin: 0 0 16px; text-shadow: 0 4px 20px rgba(244,114,182,0.5);
        }
        #start-screen p { font-size: 1.25rem; color: #d1d5db; margin: 0 0 24px; }
        .label { font-size: 1rem; color: #9ca3af; margin: 0 0 10px; }

        #loading-overlay { z-index: 100; background: rgba(0,0,0,0.9); }
        .loader {
            border: 5px solid #f3f3f3; border-top: 5px solid #ffb7c5; border-radius: 50%;
            width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading-text { font-size: 1.2rem; font-weight: 700; max-width: 520px; line-height: 1.6; white-space: pre-line; }
        #loading-retry { margin-top: 20px; display: none; }

        /* 카운트다운 */
        #countdown { z-index: 40; pointer-events: none; }
        #countdown-num {
            font-size: clamp(8rem, 30vw, 16rem); font-weight: 900; color: #fff;
            text-shadow: 0 0 40px rgba(244,114,182,0.9), 4px 4px 8px rgba(0,0,0,0.8);
            line-height: 1;
        }
        #countdown-num.pop { animation: pop 0.9s ease-out; }
        @keyframes pop { 0% { transform: scale(1.6); opacity: 0; } 25% { transform: scale(1); opacity: 1; } 100% { transform: scale(0.9); opacity: 0.9; } }
        #countdown-sub { font-size: 1.5rem; font-weight: 700; margin-top: 12px; text-shadow: 2px 2px 6px rgba(0,0,0,0.8); }

        /* 일시정지 */
        #pause-screen h2 { font-size: 3rem; margin: 0 0 12px; }
        #pause-screen p { font-size: 1.2rem; color: #d1d5db; margin: 0; }

        /* 게임 종료 */
        #game-over h2 { font-size: 3rem; font-weight: 900; color: #f472b6; margin: 0 0 10px; }
        #game-over .final { font-size: 1.6rem; margin: 0 0 6px; }
        #game-over .final b { color: #fde047; font-size: 2.6rem; }
        #game-over .caught { font-size: 1.15rem; color: #d1d5db; margin: 0 0 28px; }
        .row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
    </style>
</head>
<body>

<div id="game-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
        <div class="score-board">Score: <span id="score">0</span></div>
        <div class="time-board" id="time-board">Time: <span id="time">15</span>s</div>
        <p class="hint">손가락으로 벚꽃을 터치하세요! 🌸</p>
    </div>

    <div id="top-right">
        <button id="sound-btn" class="btn icon-btn" title="소리 켜기/끄기">🔊</button>
        <button id="quit-btn" class="btn btn-red btn-sm">게임 종료</button>
    </div>

    <!-- 로딩 -->
    <div id="loading-overlay" class="overlay hidden">
        <div class="loader"></div>
        <p id="loading-text">AI 모델을 불러오는 중...</p>
        <button id="loading-retry" class="btn btn-gray btn-md">처음으로</button>
    </div>

    <!-- 시작 화면 -->
    <div id="start-screen" class="overlay dim">
        <h1>🌸 벚꽃 캐치캐치 🌸</h1>
        <p>카메라 앞에서 손가락을 움직여 떨어지는 벚꽃을 터치하세요!</p>
        <p class="label">제한 시간</p>
        <div class="seg" id="time-select">
            <button data-sec="15">15초</button>
            <button data-sec="30">30초</button>
            <button data-sec="60">60초</button>
        </div>
        <div style="height: 28px"></div>
        <button id="start-btn" class="btn btn-pink btn-lg">게임 시작</button>
    </div>

    <!-- 카운트다운 -->
    <div id="countdown" class="overlay dim-light hidden">
        <div id="countdown-num">3</div>
        <div id="countdown-sub">준비하세요!</div>
    </div>

    <!-- 일시정지 -->
    <div id="pause-screen" class="overlay dim hidden">
        <h2>⏸ 일시정지</h2>
        <p>화면으로 돌아오면 3초 뒤에 다시 시작해요.</p>
    </div>

    <!-- 게임 종료 -->
    <div id="game-over" class="overlay dim hidden">
        <h2 id="game-over-title">게임 종료!</h2>
        <p class="final">최종 점수 <b id="final-score">0</b>점</p>
        <p class="caught">잡은 벚꽃 <span id="final-caught">0</span>개</p>
        <div class="row">
            <button id="retry-btn" class="btn btn-pink btn-md">다시 도전 🌸</button>
            <button id="home-btn" class="btn btn-gray btn-md">시간 바꾸기</button>
        </div>
    </div>
</div>

<script type="module">
    // 버전을 고정해 두어야 라이브러리가 갑자기 바뀌어도 게임이 깨지지 않는다
    const MP_VERSION = "0.10.14";
    const { HandLandmarker, FilesetResolver } =
        await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}/vision_bundle.mjs`);

    const $ = (id) => document.getElementById(id);
    const video = $('webcam');
    const canvas = $('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = $('score'), timeEl = $('time'), timeBoard = $('time-board');
    const loadingOverlay = $('loading-overlay'), loadingText = $('loading-text'), loadingRetry = $('loading-retry');
    const startScreen = $('start-screen'), startBtn = $('start-btn'), timeSelect = $('time-select');
    const countdownEl = $('countdown'), countdownNum = $('countdown-num'), countdownSub = $('countdown-sub');
    const pauseScreen = $('pause-screen');
    const gameOver = $('game-over'), gameOverTitle = $('game-over-title');
    const finalScoreEl = $('final-score'), finalCaughtEl = $('final-caught');
    const topRight = $('top-right'), quitBtn = $('quit-btn'), soundBtn = $('sound-btn');

    // ===== 상태 =====
    let handLandmarker = null;
    let cameraReady = false;
    let loopStarted = false;
    let state = 'idle';              // idle | loading | countdown | playing | paused | over
    let score = 0, caught = 0;
    let timeLimit = parseInt(localStorage.getItem('cherry_time') || '15', 10);
    let timeLeftMs = 0;
    let petals = [], particles = [];
    let lastVideoTime = -1, results = null;
    let lastTs = null;
    let countdownToken = 0;
    let soundOn = localStorage.getItem('cherry_sound') !== 'off';

    // ===== 효과음 (Web Audio로 직접 합성 — 파일 필요 없음) =====
    let audioCtx = null;
    function ensureAudio() {
        if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }
    function tone(freq, dur, { type = 'sine', vol = 0.25, slideTo = null, delay = 0 } = {}) {
        if (!soundOn || !audioCtx) return;
        const t0 = audioCtx.currentTime + delay;
        const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t0);
        if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(g).connect(audioCtx.destination);
        osc.start(t0); osc.stop(t0 + dur + 0.05);
    }
    const sfx = {
        catch: () => { tone(880, 0.12, { slideTo: 1400, vol: 0.2 }); tone(1760, 0.08, { vol: 0.08, delay: 0.04 }); },
        tick:  () => tone(660, 0.12, { type: 'square', vol: 0.12 }),
        go:    () => { tone(880, 0.25, { vol: 0.2 }); tone(1320, 0.3, { vol: 0.2, delay: 0.1 }); },
        end:   () => { tone(660, 0.25, { vol: 0.2 }); tone(440, 0.4, { vol: 0.2, delay: 0.2 }); },
    };
    function updateSoundBtn() { soundBtn.textContent = soundOn ? '🔊' : '🔇'; }
    soundBtn.addEventListener('click', () => {
        soundOn = !soundOn;
        localStorage.setItem('cherry_sound', soundOn ? 'on' : 'off');
        updateSoundBtn();
        if (soundOn) { ensureAudio(); sfx.tick(); }
    });
    updateSoundBtn();

    // ===== 시간 선택 =====
    function renderTimeSelect() {
        timeSelect.querySelectorAll('button').forEach(b => b.classList.toggle('active', parseInt(b.dataset.sec, 10) === timeLimit));
    }
    timeSelect.addEventListener('click', (e) => {
        const b = e.target.closest('button[data-sec]');
        if (!b) return;
        timeLimit = parseInt(b.dataset.sec, 10);
        localStorage.setItem('cherry_time', timeLimit);
        renderTimeSelect();
    });
    renderTimeSelect();

    // ===== 시작 =====
    startBtn.addEventListener('click', async () => {
        ensureAudio();
        startScreen.classList.add('hidden');
        if (cameraReady && handLandmarker) { beginCountdown(false); return; }
        state = 'loading';
        showLoading("AI 모델을 불러오는 중...");
        const ok = await initMediaPipe();
        if (ok) await startCamera();
    });

    function showLoading(text, withRetry = false) {
        loadingOverlay.classList.remove('hidden');
        loadingText.textContent = text;
        loadingRetry.style.display = withRetry ? 'inline-block' : 'none';
    }
    loadingRetry.addEventListener('click', () => {
        loadingOverlay.classList.add('hidden');
        startScreen.classList.remove('hidden');
        state = 'idle';
    });

    // ===== 1. MediaPipe 초기화 (GPU가 안 되면 CPU로 재시도) =====
    async function initMediaPipe() {
        try {
            const vision = await FilesetResolver.forVisionTasks(
                `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}/wasm`
            );
            const create = (delegate) => HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                    delegate,
                },
                runningMode: "VIDEO",
                numHands: 2,
            });
            try {
                handLandmarker = await create("GPU");
            } catch (gpuErr) {
                console.warn("GPU 사용 불가, CPU로 전환:", gpuErr);
                handLandmarker = await create("CPU");
            }
            return true;
        } catch (error) {
            console.error("MediaPipe 초기화 에러:", error);
            showLoading("AI 모델을 불러오지 못했어요.\n인터넷 연결을 확인하고 다시 시도해 주세요.", true);
            return false;
        }
    }

    // ===== 2. 카메라 시작 (오류 종류별 안내) =====
    async function startCamera() {
        showLoading("카메라를 연결하는 중...");
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showLoading("이 환경에서는 카메라를 쓸 수 없어요.\n주소가 https:// 또는 localhost 인지 확인해 주세요.", true);
            return;
        }
        try {
            // ideal 로 요청하면 해상도를 지원하지 않는 카메라도 오류 없이 가능한 해상도로 열린다
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
                audio: false,
            });
            video.srcObject = stream;
            video.addEventListener("loadeddata", () => {
                cameraReady = true;
                loadingOverlay.classList.add('hidden');
                resizeCanvas();
                if (!loopStarted) { loopStarted = true; requestAnimationFrame(renderLoop); }
                beginCountdown(false);
            }, { once: true });
        } catch (error) {
            console.error("카메라 접근 에러:", error);
            let msg;
            switch (error.name) {
                case "NotAllowedError":
                case "PermissionDeniedError":
                    msg = "카메라 사용 권한이 거부되었어요.\n주소창의 카메라 아이콘을 눌러 '허용'으로 바꾼 뒤 새로고침 해주세요.";
                    break;
                case "NotFoundError":
                case "DevicesNotFoundError":
                case "OverconstrainedError":
                    msg = "카메라를 찾을 수 없어요.\n웹캠이 연결되어 있는지 확인해 주세요.";
                    break;
                case "NotReadableError":
                case "TrackStartError":
                    msg = "카메라를 켤 수 없어요.\n다른 프로그램(줌, 팀즈 등)이 카메라를 사용 중이면 닫고 다시 시도해 주세요.";
                    break;
                default:
                    msg = `카메라 오류가 발생했어요. (${error.name})\n새로고침 후 다시 시도해 주세요.`;
            }
            showLoading(msg, true);
        }
    }

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    // 영상은 object-fit: cover 로 잘려서 보이므로, 손 좌표도 같은 방식으로 화면 좌표로 바꾼다
    function videoToScreen(nx, ny) {
        const vw = video.videoWidth || 1280, vh = video.videoHeight || 720;
        const cw = canvas.width, ch = canvas.height;
        const s = Math.max(cw / vw, ch / vh);
        const dw = vw * s, dh = vh * s;
        const ox = (cw - dw) / 2, oy = (ch - dh) / 2;
        return { x: ox + (1 - nx) * dw, y: oy + ny * dh };   // 좌우 반전(거울) 반영
    }

    // ===== 3. 카운트다운 → 게임 시작 =====
    function beginCountdown(resume) {
        const token = ++countdownToken;
        gameOver.classList.add('hidden');
        topRight.classList.remove('show');

        if (!resume) {
            score = 0; caught = 0;
            timeLeftMs = timeLimit * 1000;
            scoreEl.textContent = score;
            updateTimeDisplay();
            petals = []; particles = [];
            createPetals();
        }

        if (document.hidden) {            // 탭이 가려진 상태면 돌아왔을 때 카운트다운
            state = 'paused';
            pauseScreen.classList.remove('hidden');
            return;
        }
        state = 'countdown';
        pauseScreen.classList.add('hidden');
        countdownEl.classList.remove('hidden');
        countdownSub.textContent = resume ? '다시 시작해요!' : '손을 카메라 앞에 준비하세요!';

        const steps = ['3', '2', '1', '시작!'];
        let i = 0;
        const next = () => {
            if (token !== countdownToken) return;       // 취소됨
            if (i < steps.length) {
                countdownNum.textContent = steps[i];
                countdownNum.classList.remove('pop'); void countdownNum.offsetWidth; countdownNum.classList.add('pop');
                i === 3 ? sfx.go() : sfx.tick();
                i++;
                setTimeout(next, i === 4 ? 700 : 1000);
            } else {
                countdownEl.classList.add('hidden');
                topRight.classList.add('show');
                state = 'playing';
                lastTs = null;
            }
        };
        next();
    }

    function updateTimeDisplay() {
        const s = Math.max(0, Math.ceil(timeLeftMs / 1000));
        timeEl.textContent = s;
        timeBoard.classList.toggle('warn', state === 'playing' && s <= 5);
    }

    function endGame(title) {
        state = 'over';
        countdownToken++;
        timeBoard.classList.remove('warn');
        topRight.classList.remove('show');
        gameOverTitle.textContent = title || "게임 종료!";
        finalScoreEl.textContent = score;
        finalCaughtEl.textContent = caught;
        gameOver.classList.remove('hidden');
        sfx.end();
    }

    quitBtn.addEventListener('click', () => {
        if (state !== 'playing') return;
        if (confirm("게임을 그만하고 점수를 볼까요?")) endGame("게임 중단!");
    });
    $('retry-btn').addEventListener('click', () => { ensureAudio(); beginCountdown(false); });
    $('home-btn').addEventListener('click', () => {
        gameOver.classList.add('hidden');
        startScreen.classList.remove('hidden');
        state = 'idle';
    });

    // 탭을 벗어나면 일시정지, 돌아오면 카운트다운 후 재개
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            if (state === 'playing' || state === 'countdown') {
                countdownToken++;
                countdownEl.classList.add('hidden');
                topRight.classList.remove('show');
                state = 'paused';
                pauseScreen.classList.remove('hidden');
            }
        } else if (state === 'paused') {
            beginCountdown(true);
        }
    });

    // ===== 벚꽃 / 파티클 (속도는 초 단위 — 모니터 주사율과 무관) =====
    class Petal {
        constructor(startY = 0) { this.reset(); this.y = startY; }
        reset() {
            this.x = Math.random() * canvas.width;
            this.y = -Math.random() * 100 - 50;
            this.size = Math.random() * 8 + 12;
            this.speed = (Math.random() * 3 + 2.5) * 60;     // px/초
            this.angle = Math.random() * Math.PI * 2;
            this.spin = (Math.random() * 0.04 - 0.02) * 60;   // rad/초
            this.color = `rgba(255, ${190 + Math.random() * 40}, ${205 + Math.random() * 40}, 0.9)`;
        }
        update(dt) {
            this.y += this.speed * dt;
            this.x += Math.sin(this.y / 50) * 60 * dt;
            this.angle += this.spin * dt;
            if (this.y > canvas.height + 50) this.reset();
        }
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);
            ctx.fillStyle = this.color;
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.rotate((Math.PI * 2) / 5);
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-this.size / 2, -this.size, -this.size, -this.size / 2, 0, -this.size * 0.8);
                ctx.bezierCurveTo(this.size, -this.size / 2, this.size / 2, -this.size, 0, 0);
                ctx.fill();
            }
            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y;
            this.size = Math.random() * 4 + 2;
            this.vx = (Math.random() * 8 - 4) * 60;
            this.vy = (Math.random() * 8 - 4) * 60;
            this.life = 1.0;
            this.color = color;
        }
        update(dt) { this.x += this.vx * dt; this.y += this.vy * dt; this.life -= 1.8 * dt; }
        draw() {
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }

    function createPetals() {
        for (let i = 0; i < 35; i++) {
            petals.push(new Petal(-Math.random() * 30 - i * (canvas.height / 20)));
        }
    }

    // ===== 4. 메인 루프 =====
    function renderLoop(ts) {
        requestAnimationFrame(renderLoop);
        let dt = lastTs === null ? 0 : (ts - lastTs) / 1000;
        lastTs = ts;
        dt = Math.min(dt, 0.1);   // 탭 전환 등으로 오래 멈췄다가 돌아와도 한 번에 튀지 않게

        if (handLandmarker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
            lastVideoTime = video.currentTime;
            results = handLandmarker.detectForVideo(video, performance.now());
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 손끝 5개(엄지~새끼) × 최대 두 손
        const activePoints = [];
        if (results && results.landmarks) {
            for (const landmarks of results.landmarks) {
                for (const idx of [4, 8, 12, 16, 20]) {
                    activePoints.push(videoToScreen(landmarks[idx].x, landmarks[idx].y));
                }
            }
        }
        ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
        for (const p of activePoints) {
            ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, Math.PI * 2); ctx.fill();
        }

        // 타이머
        if (state === 'playing') {
            timeLeftMs -= dt * 1000;
            updateTimeDisplay();
            if (timeLeftMs <= 0) { timeLeftMs = 0; endGame("시간 초과!"); }
        }

        for (const petal of petals) {
            petal.update(dt);
            if (state === 'playing') {
                for (const p of activePoints) {
                    if (Math.hypot(petal.x - p.x, petal.y - p.y) < petal.size * 3) {
                        for (let i = 0; i < 15; i++) particles.push(new Particle(petal.x, petal.y, petal.color));
                        score += 10; caught++;
                        scoreEl.textContent = score;
                        sfx.catch();
                        petal.reset();
                        break;
                    }
                }
            }
            petal.draw();
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update(dt);
            particles[i].draw();
            if (particles[i].life <= 0) particles.splice(i, 1);
        }
    }
</script>
